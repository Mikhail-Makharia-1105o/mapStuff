<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Map Game</title>
    <link rel="stylesheet" href="node_modules/ol/ol.css" />
    <script type="module" src="main.js" defer></script>
    <style>
      .map {
        width: 100%;
        height: 400px;
      }
      a.skiplink {
        position: absolute;
        clip: rect(1px, 1px, 1px, 1px);
        padding: 0;
        border: 0;
        height: 1px;
        width: 1px;
        overflow: hidden;
      }
      a.skiplink:focus {
        clip: auto;
        height: auto;
        width: auto;
        background-color: #fff;
        padding: 0.3em;
      }
      #map:focus {
        outline: #4a74a8 solid 0.15em;
      }
    </style>
    <link rel="stylesheet" href="main_style.css" type="text/css" />
  </head>
  <body>
    <a class="skiplink" href="#map">Go to map</a>
    <div id="map" class="map" tabindex="0"></div>
    <div class="random-country">
      <h2 class="random-country-name"></h2>
    </div>
    <div id="info">Current country: <span id="random-country"></span></div>
    <div id="lives">Current lives: <span id="lives-amount"></span></div>
    <div id="score">Current score: <span id="score-amount">0</span></div>
    <div id="streak">Current streak: <span id="streak-amount">0</span></div>
  </body>
  </body>
</html>
