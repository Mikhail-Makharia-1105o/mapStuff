<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map Game - Play</title>
    <link rel="stylesheet" href="node_modules/ol/ol.css" />
    <link rel="stylesheet" href="main_style.css" type="text/css" />
  </head>
  <body>
    <div class="game-container">
      <header class="game-header">
        <div class="header-content">
          <h1 class="game-title">Map Game</h1>
          <button
            class="theme-toggle"
            id="theme-toggle"
            aria-label="Toggle dark mode"
          >
            <span class="theme-icon">D</span>
          </button>
        </div>
        <a href="index.html" class="back-link">Back to Menu</a>
      </header>

      <div class="game-content">
        <div class="stats-panel">
          <div class="stat">
            <span class="stat-label">Find Country</span>
            <span class="stat-value country-name" id="random-country"
              >Loading...</span
            >
          </div>

          <div class="timer-container">
            <div class="timer-bar">
              <div class="timer-fill" id="timer-fill"></div>
            </div>
            <span class="timer-text" id="timer-text">60s</span>
          </div>

          <div class="stats-row">
            <div class="stat stat-compact">
              <span class="stat-label">Lives</span>
              <span class="stat-value stat-lives" id="lives-amount">5</span>
            </div>
            <div class="stat stat-compact">
              <span class="stat-label">Score</span>
              <span class="stat-value stat-score" id="score-amount">0</span>
            </div>
            <div class="stat stat-compact">
              <span class="stat-label">Streak</span>
              <span class="stat-value stat-streak" id="streak-amount">0</span>
            </div>
            <button class="skip-btn" id="skip-btn">Skip</button>
          </div>
        </div>

        <a class="skiplink" href="#map">Go to map</a>
        <div id="map" class="map" tabindex="0"></div>

        <div class="map-hint">
          <p>DB:</p>
          <button id="debug-win">WIN</button>
        </div>
      </div>

      <div class="random-country" style="display: none">
        <h2 class="random-country-name"></h2>
      </div>
      <div id="info" style="display: none">
        Current country: <span id="random-country"></span>
      </div>
    </div>

    <script type="module">
      const themeToggle = document.getElementById("theme-toggle");
      const htmlElement = document.documentElement;

      const savedTheme =
        localStorage.getItem("theme") ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light");

      htmlElement.setAttribute("data-theme", savedTheme);
      updateThemeIcon(savedTheme);

      function updateThemeIcon(theme) {
        themeToggle.querySelector(".theme-icon").textContent =
          theme === "dark" ? "L" : "D";
      }

      themeToggle.addEventListener("click", () => {
        const currentTheme = htmlElement.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        htmlElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("theme", newTheme);
        updateThemeIcon(newTheme);
      });
    </script>
    <script type="module" src="main.js"></script>
  </body>
</html>
