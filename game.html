<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      async
      src="https://ga.jspm.io/npm:es-module-shims@1.8.0/dist/es-module-shims.js"
    ></script>
    <script type="importmap">
      {
        "imports": {
          "ol/": "https://cdn.jsdelivr.net/npm/ol@9.0.0/",
          "ol": "https://cdn.jsdelivr.net/npm/ol@9.0.0/index.js",
          "rbush": "https://cdn.jsdelivr.net/npm/rbush@4.1.1/+esm",
          "geotiff": "https://cdn.jsdelivr.net/npm/geotiff@2.1.3/+esm"
        }
      }
    </script>
    <style>
      .ol-box {
        box-sizing: border-box;
        border-radius: 2px;
        border: 1.5px solid blue;
        background-color: rgba(0, 0, 255, 0.1);
      }
      .ol-mouse-target {
        touch-action: none;
      }
      .ol-viewport {
        position: relative;
        overflow: hidden;
        width: 100%;
        height: 100%;
      }
      .ol-unselectable {
        -webkit-user-select: none;
        -moz-user-select: none;
        user-select: none;
      }
      .ol-control {
        position: absolute;
        background-color: rgba(255, 255, 255, 0.4);
        border-radius: 4px;
        padding: 2px;
      }
      .ol-control:hover {
        background-color: rgba(255, 255, 255, 0.8);
      }
      .ol-zoom {
        top: 0.5em;
        left: 0.5em;
      }
      .ol-rotate {
        top: 0.5em;
        right: 0.5em;
      }
      .ol-attribution {
        text-align: right;
        bottom: 0;
        right: 0;
        max-width: calc(100% - 1.3em);
        font-size: 12px;
        opacity: 0.7;
      }
    </style>
    <link rel="stylesheet" href="main_style.css" type="text/css" />
    <title>Map Game</title>
  </head>
  <body>
    <div class="game-container">
      <header class="game-header">
        <div class="header-content">
          <h1 class="game-title">Map Game</h1>
          <button
            class="theme-toggle"
            id="theme-toggle"
            aria-label="Toggle dark mode"
          >
            <span class="theme-icon">D</span>
          </button>
        </div>
        <a href="index.html" class="back-link">Back to Menu</a>
      </header>

      <div class="game-content">
        <div class="stats-panel">
          <div class="stat">
            <span class="stat-label">Find Country</span>
            <span class="stat-value country-name" id="random-country"
              >Loading...</span
            >
          </div>

          <div class="timer-container">
            <div class="timer-bar">
              <div class="timer-fill" id="timer-fill"></div>
            </div>
            <span class="timer-text" id="timer-text">60s</span>
          </div>

          <div class="stats-row">
            <div class="stat stat-compact">
              <span class="stat-label">Lives</span>
              <span class="stat-value stat-lives" id="lives-amount">5</span>
            </div>
            <div class="stat stat-compact">
              <span class="stat-label">Score</span>
              <span class="stat-value stat-score" id="score-amount">0</span>
            </div>
            <div class="stat stat-compact">
              <span class="stat-label">Streak</span>
              <span class="stat-value stat-streak" id="streak-amount">0</span>
            </div>
            <button class="skip-btn" id="skip-btn">Skip</button>
          </div>
        </div>

        <a class="skiplink" href="#map">Go to map</a>
        <div id="map" class="map" tabindex="0"></div>

        <div class="map-hint">
          <p>DB:</p>
          <button id="debug-win">WIN</button>
        </div>
      </div>

      <div class="random-country" style="display: none">
        <h2 class="random-country-name"></h2>
      </div>
      <div id="info" style="display: none">
        Current country: <span id="random-country"></span>
      </div>
    </div>

    <script type="module">
      const themeToggle = document.getElementById("theme-toggle");
      const htmlElement = document.documentElement;

      const savedTheme =
        localStorage.getItem("theme") ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches
          ? "dark"
          : "light");

      htmlElement.setAttribute("data-theme", savedTheme);
      updateThemeIcon(savedTheme);

      function updateThemeIcon(theme) {
        themeToggle.querySelector(".theme-icon").textContent =
          theme === "dark" ? "L" : "D";
      }

      themeToggle.addEventListener("click", () => {
        const currentTheme = htmlElement.getAttribute("data-theme");
        const newTheme = currentTheme === "dark" ? "light" : "dark";
        htmlElement.setAttribute("data-theme", newTheme);
        localStorage.setItem("theme", newTheme);
        updateThemeIcon(newTheme);
      });
    </script>
    <script type="module" src="main.js"></script>
  </body>
</html>
